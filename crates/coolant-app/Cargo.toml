[package]
name = "coolant-app"
description = "Live desktop dashboard for coolant, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "coolant-app"
path = "src/main.rs"

[dependencies]
coolant-platform.workspace = true
coolant-core.workspace = true
coolant-workspace.workspace = true
libc.workspace = true
serde_json.workspace = true
# runtime_shaders: compile Metal shaders at launch, so building needs only the
# Xcode command line tools rather than full Xcode.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

# The menu bar item talks to AppKit directly (same crates GPUI uses).
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.6"
block = "0.1"
