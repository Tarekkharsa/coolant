[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-beta.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/Tarekkharsa/coolant"

[workspace.dependencies]
coolant-platform = { path = "crates/coolant-platform" }
coolant-core = { path = "crates/coolant-core" }
coolant-bench = { path = "crates/coolant-bench" }
coolant-workspace = { path = "crates/coolant-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
